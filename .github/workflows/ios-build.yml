name: iOS build

# Por ahora solo se corre manualmente (botón "Run workflow" en la pestaña Actions de GitHub),
# para no gastar minutos del runner macOS en cada push mientras se arma el proyecto.
# Cuando ya tengamos firma configurada, se puede cambiar a correr automático en cada push a main.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: app-nativa
        run: npm ci

      - name: Sincronizar el proyecto iOS de Capacitor
        working-directory: app-nativa
        run: npx cap sync ios

      # --- Compilación sin firma, solo para validar que el proyecto compila ---
      # (para simulador, no genera un .ipa instalable en un iPhone real ni subible a App Store)
      - name: Compilar para el simulador (validación)
        run: |
          cd app-nativa/ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

      # --- A partir de aquí, firma real: certificado de distribución +
      # perfil de aprovisionamiento, ya generados y guardados como secrets
      # del repo. Sigue el patrón estándar de Apple/GitHub Actions: se crea
      # un keychain temporal aislado (se borra al final del job, nunca toca
      # el keychain real del runner), se importa el certificado ahí, y se
      # instala el perfil donde Xcode lo espera encontrar.
      - name: Importar certificado y perfil de aprovisionamiento
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo -n "$CERTIFICATE_P12" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          echo -n "$PROVISIONING_PROFILE" | base64 --decode -o $RUNNER_TEMP/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archivar y exportar el .ipa firmado
        run: |
          cd app-nativa/ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Money Freak App Store" \
            DEVELOPMENT_TEAM=D5GDMDV3X5 \
            archive

          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>D5GDMDV3X5</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.miscuentaspro.app</key>
              <string>Money Freak App Store</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Subir el .ipa como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFreak-ipa
          path: ${{ runner.temp }}/export/*.ipa

      # --- Subida automática a App Store Connect / TestFlight ---
      # Usa una API Key de App Store Connect (rol "App Manager"), distinta
      # al certificado de distribución. `xcrun altool` instala la llave en
      # la ubicación estándar que espera (~/.appstoreconnect/private_keys)
      # y sube el .ipa directo, sin necesitar Mac/Transporter del usuario.
      - name: Subir el .ipa a App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_API_KEY_P8" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA_PATH=$(ls $RUNNER_TEMP/export/*.ipa)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Borrar el keychain temporal
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
