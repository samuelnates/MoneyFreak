name: Import asesor PNG assets

on:
  push:
    branches: [main]
    paths:
      - 'app-web/assets/asesores-raw/.upload-ready'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode PNG chunks
        shell: bash
        run: |
          set -euo pipefail
          SRC="app-web/assets/asesores-raw/.avatar-upload"
          DEST="app-web/assets/asesores-raw"
          find "$SRC" -type f -name '*.part' | sed -E 's/\.[0-9]{3}\.part$//' | sort -u | while read -r prefix; do
            key="$(basename "$prefix")"
            personaje="${key%%__*}"
            filename="${key#*__}.png"
            mkdir -p "$DEST/$personaje"
            cat "${prefix}".*.part | base64 --decode > "$DEST/$personaje/$filename"
          done

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app-web/assets/asesores-raw/.avatar-upload
          rm -f app-web/assets/asesores-raw/.upload-ready
          rm -f .github/workflows/import-asesores.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-web/assets/asesores-raw .github/workflows/import-asesores.yml
          git commit -m "Agregar assets de asesores animables"
          git push
