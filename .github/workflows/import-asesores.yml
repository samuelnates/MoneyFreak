name: Import asesor PNG assets

on:
  push:
    branches: [main]
    paths:
      - 'app-web/assets/asesores-raw/.upload-ready'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode and extract avatar package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="app-web/assets/asesores-raw"
          SRC="$ROOT/.avatar-upload"
          cat "$SRC"/archive.*.part | base64 --decode > /tmp/asesores.tar.gz
          tar -xzf /tmp/asesores.tar.gz -C "$ROOT"

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app-web/assets/asesores-raw/.avatar-upload
          rm -f app-web/assets/asesores-raw/.upload-ready
          rm -f .github/workflows/import-asesores.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-web/assets/asesores-raw .github/workflows/import-asesores.yml
          git commit -m "Agregar assets de asesores animables"
          git push
